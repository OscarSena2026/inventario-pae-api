# Nombre de la aplicacion
spring.application.name=api-proyecto

# Conexion a MySQL: base de datos inventario_pae (se crea con database/01_script_bd_proyecto.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_pae?serverTimezone=UTC
spring.datasource.username=auth_user
# La contrasena NO se escribe aqui para no subirla a GitHub.
# Se toma de la variable de entorno DB_PASSWORD (si no existe, queda vacia).
spring.datasource.password=${DB_PASSWORD:}

# Las tablas las crean los scripts de la carpeta database/, JPA no modifica la base de datos
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Origen del front-end (React con Vite usa el puerto 5173). Cambielo si su React usa otro puerto.
app.cors.origen=http://localhost:5173

# Puerto del servicio
server.port=8080
