# AMBIENTE DE PRUEBAS (servidor de pruebas / despliegue de prueba, con una base de datos DISTINTA a la de desarrollo)
# Se activa con: --spring.profiles.active=test
# Todos los datos de conexion llegan por variables de entorno; no se guarda ninguna clave en el repositorio.

# Base de datos de pruebas (por defecto, inventario_pae_test en el mismo servidor MySQL local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventario_pae_test?serverTimezone=UTC}
spring.datasource.username=${DB_USER:auth_user}
spring.datasource.password=${DB_PASSWORD:}

# En pruebas no se muestran las consultas SQL y solo se registran avisos y errores
spring.jpa.show-sql=false
logging.level.co.edu.sena.pae=INFO

# URL del front-end de pruebas (por defecto, el local) y puerto (PORT lo asigna la mayoria de plataformas en la nube)
app.cors.origen=${CORS_ORIGEN:http://localhost:5173}
server.port=${PORT:8080}
