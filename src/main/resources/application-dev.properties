# AMBIENTE DE DESARROLLO (equipo del aprendiz: Windows 11, IntelliJ IDEA, MySQL local)
# Se activa con: --spring.profiles.active=dev  (en IntelliJ: Edit Configurations > Active profiles = dev)

# Base de datos local inventario_pae (se crea con database/01_script_bd_proyecto.sql y 02_ajustes_api.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_pae?serverTimezone=UTC
spring.datasource.username=auth_user
# La contrasena NO se escribe aqui: se toma de la variable de entorno DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD:}

# En desarrollo se ven las consultas SQL y el detalle de los mensajes de la aplicacion
spring.jpa.show-sql=true
logging.level.co.edu.sena.pae=DEBUG

# Front-end local (React con Vite)
app.cors.origen=http://localhost:5173
server.port=8080
